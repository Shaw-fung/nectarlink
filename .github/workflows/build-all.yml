# SPDX-License-Identifier: GPL-3.0-or-later
# Builds every desktop platform NectarLink ships, the same way upstream's
# release pipeline does, plus the macOS preview for Apple Silicon. Called by
# nightly-all.yml (sync -> build -> release). Upstream has no macOS build of
# its own, so that part lives only here.
#
# NOTE: the Intel (x86_64) macOS build is intentionally NOT here — GitHub's
# Intel macOS runners are scarce and queue for a long time, so it lives as a
# decoupled "best-effort, attach later" job in nightly-all.yml that never
# blocks the other platforms from being published.
#
# Reuses upstream's proven Windows/Linux packaging scripts (scripts/,
# desktop/packaging/linux/). Android is intentionally omitted: it needs a
# signing keystore secret this mirror does not have.
name: Build all platforms

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  QT_VERSION: "6.12.0"

jobs:
  windows-x64:
    name: Windows installer (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with: { ref: main }
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: mirror-win-x64, save-if: true }
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          aqtsource: git+https://github.com/miurahr/aqtinstall.git
      - name: Install NSIS
        shell: pwsh
        run: ./scripts/install-nsis.ps1
      - name: Build the installer
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: target/package/*-setup.exe

  windows-arm64:
    name: Windows installer (ARM64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with: { ref: main }
      - name: Install the pinned Rust toolchain and the ARM64 target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: mirror-win-arm64, save-if: true }
      - name: Install Qt (ARM64, cross-compiled)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_arm64_cross_compiled
          cache: true
          aqtsource: git+https://github.com/miurahr/aqtinstall.git
      - name: Install NSIS
        shell: pwsh
        run: ./scripts/install-nsis.ps1
      - name: Build the installer
        shell: pwsh
        run: ./scripts/package.ps1 -Arch arm64
      - uses: actions/upload-artifact@v7
        with:
          name: windows-arm64
          path: target/package/*-setup.exe

  linux:
    name: Linux packages (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { ref: main }
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: mirror-linux-x64, save-if: true }
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgl1-mesa-dev libx11-dev libxcb1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig1-dev \
            libfreetype-dev libdbus-1-dev libxtst-dev libavcodec-dev libavutil-dev \
            qt6-l10n-tools file desktop-file-utils appstream rpm shellcheck
          pkg-config --exists libavcodec libavutil
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtshadertools qtwaylandcompositor
          cache: true
          aqtsource: git+https://github.com/miurahr/aqtinstall.git
      - name: Install appimagetool and the AppImage runtime (pinned, checked)
        run: |
          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -fsSL -o /tmp/runtime-x86_64 \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          sha256sum -c - <<'SUMS'
          ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /tmp/appimagetool
          2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  /tmp/runtime-x86_64
          SUMS
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool
          echo "APPIMAGE_RUNTIME=/tmp/runtime-x86_64" >> "$GITHUB_ENV"
      - name: Validate desktop entry and AppStream metadata
        run: |
          desktop-file-validate desktop/packaging/linux/nectarlink.desktop
          appstreamcli validate --no-net desktop/packaging/linux/org.nectarlink.desktop.metainfo.xml
      - name: Cache FFmpeg source archives
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ffmpeg-sources
          key: ffmpeg-sources-${{ hashFiles('desktop/packaging/linux/build-ffmpeg-backends.sh') }}
      - name: Build and package (.deb, .rpm, AppImage, tarball)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          FFMPEG_SOURCE_CACHE: ${{ runner.temp }}/ffmpeg-sources
        run: |
          cargo build --release -p nectarlink-desktop
          bash ./desktop/packaging/linux/build-ffmpeg-backends.sh
          ./desktop/packaging/linux/build-deb.sh
          ./desktop/packaging/linux/build-rpm.sh
          ./desktop/packaging/linux/build-appimage.sh
          ./desktop/packaging/linux/build-tarball.sh
          cp desktop/packaging/linux/install.sh dist/install.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.tar.gz
            dist/install.sh

  macos-arm64:
    name: macOS app (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with: { ref: main }
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: mirror-macos-app, save-if: true }
      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtshadertools
          cache: true
          aqtsource: git+https://github.com/miurahr/aqtinstall.git
      - name: Build the desktop app
        run: cargo build --release -p nectarlink-desktop
      - name: Package the .app and .dmg
        run: bash desktop/packaging/macos/build-app.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: dist/NectarLink-*.dmg
