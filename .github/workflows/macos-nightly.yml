# SPDX-License-Identifier: GPL-3.0-or-later
# Best-effort macOS builds for the NectarLink mirror. Runs independently of
# the Windows/Linux pipeline so GitHub's scarce macOS runners can never block
# or hold a lock on the other platforms' release.
#
# Each job BUILDS AND UPLOADS its own .dmg directly on success — there is no
# shared "attach" step that waits for the other architecture, so a queued or
# cancelled Intel build can never block the Apple Silicon .dmg from shipping.
#
# Guards: a job is a no-op if its .dmg is already attached to the nightly
# release (so we don't burn scarce macOS minutes rebuilding the same thing).
#
# Triggers:
#   - workflow_run: right after "Nightly all" finishes publishing.
#   - schedule: a retry window later the same day, in case the macOS runners
#     were still queued the first time.
#   - workflow_dispatch: manual "Run workflow" (force) from the Actions tab.
name: macOS nightly

on:
  workflow_run:
    workflows: ["Nightly all"]
    types: [completed]
  schedule:
    - cron: "30 19 * * *"   # ~1.5h after the nightly build, retry window
  workflow_dispatch:
    inputs:
      force:
        description: "Build macOS even if the .dmg is already attached"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: macos-nightly
  cancel-in-progress: false

jobs:
  macos-arm64:
    name: macOS app (Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 90
    continue-on-error: true
    env:
      CARGO_TERM_COLOR: always
      QT_VERSION: "6.12.0"
    steps:
      - name: Skip if already attached (or no release yet)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "no nightly release yet; skipping"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ inputs.force }}" != "true" ] && \
             gh release view nightly --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' \
               | grep -q "macOS-arm64.dmg"; then
            echo "arm64 dmg already attached; skipping"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.guard.outputs.skip != 'true'
        with: { ref: main }
      - name: Install the pinned Rust toolchain
        if: steps.guard.outputs.skip != 'true'
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        if: steps.guard.outputs.skip != 'true'
        with: { shared-key: mirror-macos-app, save-if: true }
      - name: Install Qt ${{ env.QT_VERSION }}
        if: steps.guard.outputs.skip != 'true'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtshadertools
          cache: true
          aqtsource: git+https://github.com/miurahr/aqtinstall.git
      - name: Build the desktop app
        if: steps.guard.outputs.skip != 'true'
        run: cargo build --release -p nectarlink-desktop
      - name: Package the .app and .dmg
        if: steps.guard.outputs.skip != 'true'
        run: bash desktop/packaging/macos/build-app.sh
      - name: Upload the Apple Silicon .dmg to the nightly release
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DMG=$(ls dist/NectarLink-*-arm64.dmg 2>/dev/null || true)
          if [ -n "$DMG" ]; then
            gh release upload nightly "$DMG" --repo "$GITHUB_REPOSITORY" --clobber || true
            echo "attached $DMG to nightly"
          else
            echo "no arm64 dmg produced; skipping upload"
          fi

  macos-intel:
    # Intel (macos-13) runners are extremely scarce on GitHub's shared fleet and
    # queue for hours, which trips GitHub's resource-abuse auto-disable. So this
    # job is MANUAL ONLY (run via Actions -> macOS nightly -> Run workflow, with
    # "force" checked). The automated pipeline never queues it, keeping the repo
    # out of trouble; Apple Silicon (below) covers the automated macOS build.
    if: github.event.inputs.force == 'true'
    name: macOS app (Intel)
    runs-on: macos-13
    timeout-minutes: 60
    continue-on-error: true
    env:
      CARGO_TERM_COLOR: always
      QT_VERSION: "6.12.0"
    steps:
      - name: Skip if already attached (or no release yet)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "no nightly release yet; skipping"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ inputs.force }}" != "true" ] && \
             gh release view nightly --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' \
               | grep -q "macOS-x86_64.dmg"; then
            echo "intel dmg already attached; skipping"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.guard.outputs.skip != 'true'
        with: { ref: main }
      - name: Install the pinned Rust toolchain
        if: steps.guard.outputs.skip != 'true'
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        if: steps.guard.outputs.skip != 'true'
        with: { shared-key: mirror-macos-intel, save-if: true }
      - name: Install Qt ${{ env.QT_VERSION }}
        if: steps.guard.outputs.skip != 'true'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtshadertools
          cache: true
          aqtsource: git+https://github.com/miurahr/aqtinstall.git
      - name: Build the desktop app
        if: steps.guard.outputs.skip != 'true'
        run: cargo build --release -p nectarlink-desktop
      - name: Package the .app and .dmg
        if: steps.guard.outputs.skip != 'true'
        run: bash desktop/packaging/macos/build-app.sh
      - name: Upload the Intel .dmg to the nightly release
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DMG=$(ls dist/NectarLink-*-x86_64.dmg 2>/dev/null || true)
          if [ -n "$DMG" ]; then
            gh release upload nightly "$DMG" --repo "$GITHUB_REPOSITORY" --clobber || true
            echo "attached $DMG to nightly"
          else
            echo "no intel dmg produced; skipping upload"
          fi
