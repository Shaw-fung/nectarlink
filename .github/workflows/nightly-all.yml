# SPDX-License-Identifier: GPL-3.0-or-later
# Mirror pipeline for NectarLink:
#   1. sync  — merge upstream (thtbee/nectarlink) main into this fork, so the
#              fork tracks upstream and the version number follows it.
#   2. build — call build-all.yml (Windows x64/ARM64, Linux x86_64) — only when
#              upstream actually advanced, so idle days cost nothing.
#   3. publish — gather the successful platforms' artifacts and put them on a
#              rolling GitHub Release (tag "nightly") with install + update
#              notes.
#
# macOS (Apple Silicon + Intel) is handled by a SEPARATE workflow,
# macos-nightly.yml. It runs independently (its own concurrency group, its own
# runner queue) and attaches its .dmg to the same nightly release. This keeps
# GitHub's scarce macOS runners from ever blocking or holding a lock on the
# Windows/Linux release.
#
# Trigger: Actions -> Nightly all -> Run workflow (force builds even with no
# upstream change). No local compilation needed; everything runs on GitHub.
name: Nightly all

on:
  schedule:
    # 18:00 UTC == 02:00 Beijing. Sync + build once a day; the "changed" gate
    # below skips the build on days upstream hasn't moved.
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if upstream hasn't changed since the last run"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nightly-all
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      version: ${{ steps.ver.outputs.version }}
      commit: ${{ steps.ver.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge upstream main
        id: sync
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/thtbee/nectarlink.git \
            || git remote set-url upstream https://github.com/thtbee/nectarlink.git
          git fetch upstream main
          ahead=$(git rev-list --count HEAD..upstream/main)
          echo "upstream is $ahead commits ahead"
          if [ "$ahead" -gt 0 ]; then
            git merge upstream/main --no-edit
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Read version and commit
        id: ver
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (Windows / Linux)
    needs: sync
    if: needs.sync.outputs.changed == 'true' || inputs.force
    uses: ./.github/workflows/build-all.yml

  publish:
    name: Publish the release
    needs: [sync, build]
    if: needs.sync.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.sync.outputs.version }}
      COMMIT: ${{ needs.sync.outputs.commit }}
    steps:
      # Checkout FIRST so its default `git clean` does not wipe the artifact
      # directory that download-artifact creates right after.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v8
        with:
          path: files
          merge-multiple: true
        continue-on-error: true
      - name: Publish it as a rolling release
        run: |
          set -euo pipefail
          mkdir -p files out
          # Artifacts land in nested dirs (each upload preserves its tree);
          # flatten every file into ./out so the release + checksums are clean.
          find files -type f -exec sh -c 'cp "$1" out/' _ {} \;
          cd out

          # Hash whatever actually landed (platforms that failed to build are
          # simply absent — never let a missing glob abort the release).
          rm -f SHA256SUMS.txt
          for f in *; do
            [ -f "$f" ] && sha256sum "$f" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

          # Guard: if no platform produced anything, skip the release entirely
          # instead of publishing an empty one.
          HAVE=( *.exe *.deb *.rpm *.AppImage *.tar.gz )
          if [ "${#HAVE[@]}" -eq 0 ]; then
            echo "No build artifacts collected — skipping release."
            exit 0
          fi

          # What changed since the last published build (for the update notes).
          if git rev-parse -q --verify nightly >/dev/null 2>&1; then
            git log --no-merges --pretty=format:"- %s (%h)" nightly.."$COMMIT" > changes.txt
          else
            git log --no-merges -n 20 --pretty=format:"- %s (%h)" > changes.txt
          fi
          if [ ! -s changes.txt ]; then
            echo "(no upstream commits since the last build)" > changes.txt
          fi

          # Install + update notes.
          cat > notes.md <<EOF
          # NectarLink v$VERSION — 自动同步构建

          本发布由镜像流水线每日从上游 [thtbee/nectarlink](https://github.com/thtbee/nectarlink) 同步并自动编译，**版本号与上游保持一致**。它不是官方签名发布：macOS 为 ad-hoc 自签名（首次打开需手动放行），Windows/Linux 为社区自动构建。

          ## 安装说明

          ### Windows
          - 64 位电脑：下载 \`Nectarlink-$VERSION-x64-setup.exe\`，双击运行安装。
          - ARM64 电脑（如 Surface）：下载 \`Nectarlink-$VERSION-arm64-setup.exe\`。

          ### Linux
          - Debian / Ubuntu：\`sudo apt install ./Nectarlink-*.deb\`
          - Fedora / RHEL：\`sudo dnf install ./Nectarlink-*.rpm\`
          - 通用：给 \`Nectarlink-*.AppImage\` 加执行权限后直接运行，或解压 \`Nectarlink-*.tar.gz\`。
          - 一键脚本：\`sh install.sh\`（同目录下放置对应包）。

          ### macOS
          - Apple 芯片（M 系列）：下载 \`NectarLink-$VERSION-macOS-arm64.dmg\`，挂载后拖入“应用程序”。
          - Intel 芯片：下载 \`NectarLink-$VERSION-macOS-x86_64.dmg\`。
          - 说明：macOS 构建在独立的 best-effort 工作流中完成（Apple 芯片与 Intel 双架构），成功后自动附加到本 Release。若资产列表暂无 .dmg，说明本次 GitHub 的 macOS 运行器仍在排队，通常会在数小时内或下个构建周期补齐。官方“预览版”可用：文件传输、剪贴板、通知等；屏幕镜像 / 虚拟摄像头等重功能尚未完成。
          - 首次打开会被 Gatekeeper 拦截（ad-hoc 签名）：右键 App → 打开，或在终端执行
            \`sudo xattr -rd com.apple.quarantine /Applications/NectarLink.app\`。

          ## 更新说明（自上次构建以来的提交）
          EOF
          cat changes.txt >> notes.md
          {
            echo ""
            echo "构建于上游提交 \`${COMMIT:0:7}\`（$(date -u +%Y-%m-%d)）。校验和见 SHA256SUMS.txt。"
          } >> notes.md

          # Build the file list dynamically (only what exists).
          FILES=( *.exe *.deb *.rpm *.AppImage *.tar.gz install.sh SHA256SUMS.txt notes.md )

          # Rolling release: replace the previous "nightly" release + tag.
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create nightly \
            "${FILES[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$COMMIT" \
            --title "NectarLink v$VERSION · 自动构建 ($(date -u +%Y-%m-%d))" \
            --notes-file notes.md
          echo "published nightly @ $VERSION"
