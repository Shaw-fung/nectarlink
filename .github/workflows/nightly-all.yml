# SPDX-License-Identifier: GPL-3.0-or-later
# Mirror pipeline for NectarLink:
#   1. sync  — merge upstream (thtbee/nectarlink) main into this fork, so the
#              fork tracks upstream and the version number follows it.
#   2. build — call build-all.yml (Windows x64/ARM64, Linux x86_64, macOS
#              Apple Silicon) — only when upstream actually advanced, so idle
#              days cost nothing.
#   3. publish — gather the successful platforms' artifacts and put them on a
#              rolling GitHub Release (tag "nightly") with install + update
#              notes. This does NOT wait for the Intel macOS build.
#   4. macos-intel — a DECOUPLED, best-effort Intel (x86_64) macOS build that
#              runs AFTER publish and attaches its .dmg to the same nightly
#              release. It can queue for a long time on GitHub's scarce Intel
#              runners and must never block the other platforms from shipping.
#
# Trigger: Actions -> Nightly all -> Run workflow (force builds even with no
# upstream change). No local compilation needed; everything runs on GitHub.
name: Nightly all

on:
  schedule:
    # 18:00 UTC == 02:00 Beijing. Sync + build once a day; the "changed" gate
    # below skips the build on days upstream hasn't moved.
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if upstream hasn't changed since the last run"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nightly-all
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      version: ${{ steps.ver.outputs.version }}
      commit: ${{ steps.ver.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge upstream main
        id: sync
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/thtbee/nectarlink.git \
            || git remote set-url upstream https://github.com/thtbee/nectarlink.git
          git fetch upstream main
          ahead=$(git rev-list --count HEAD..upstream/main)
          echo "upstream is $ahead commits ahead"
          if [ "$ahead" -gt 0 ]; then
            git merge upstream/main --no-edit
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Read version and commit
        id: ver
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (Windows / Linux)
    needs: sync
    if: needs.sync.outputs.changed == 'true' || inputs.force
    uses: ./.github/workflows/build-all.yml

  # macOS Apple Silicon build, decoupled so a scarce-runner queue or failure can
  # never block the Windows/Linux release. Its artifact (if it completes) is
  # picked up by publish; if it is cancelled, the other platforms still ship.
  macos-arm64:
    name: macOS app (Apple Silicon)
    needs: [sync]
    if: needs.sync.outputs.changed == 'true' || inputs.force
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      QT_VERSION: "6.12.0"
    steps:
      - uses: actions/checkout@v7
        with: { ref: main }
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: mirror-macos-app, save-if: true }
      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtshadertools
          cache: true
          aqtsource: git+https://github.com/miurahr/aqtinstall.git
      - name: Build the desktop app
        run: cargo build --release -p nectarlink-desktop
      - name: Package the .app and .dmg
        run: bash desktop/packaging/macos/build-app.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-arm64
          path: dist/NectarLink-*.dmg

  publish:
    name: Publish the release
    needs: [build]
    if: needs.sync.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.sync.outputs.version }}
      COMMIT: ${{ needs.sync.outputs.commit }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: files
          merge-multiple: true
        continue-on-error: true
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - name: Publish it as a rolling release
        run: |
          set -euo pipefail
          cd files

          # Hash whatever actually landed (platforms that failed to build are
          # simply absent — never let a missing glob abort the release).
          rm -f SHA256SUMS.txt
          shopt -s nullglob
          for f in *; do
            [ -f "$f" ] && sha256sum "$f" >> SHA256SUMS.txt
          done
          shopt -u nullglob
          cat SHA256SUMS.txt

          # Guard: if no platform produced anything, skip the release entirely
          # instead of publishing an empty one.
          shopt -s nullglob
          HAVE=( *.exe *.deb *.rpm *.AppImage *.tar.gz *.dmg )
          shopt -u nullglob
          if [ "${#HAVE[@]}" -eq 0 ]; then
            echo "No build artifacts collected — skipping release."
            exit 0
          fi

          # What changed since the last published build (for the update notes).
          if git rev-parse -q --verify nightly >/dev/null 2>&1; then
            git log --no-merges --pretty=format:"- %s (%h)" nightly.."$COMMIT" > changes.txt
          else
            git log --no-merges -n 20 --pretty=format:"- %s (%h)" > changes.txt
          fi
          if [ ! -s changes.txt ]; then
            echo "(no upstream commits since the last build)" > changes.txt
          fi

          # Intel line depends on whether its .dmg is present in this drop.
          if ls NectarLink-*-x86_64.dmg >/dev/null 2>&1; then
            INTEL="- Intel 芯片：下载 \`NectarLink-$VERSION-macOS-x86_64.dmg\`。"
          else
            INTEL="- Intel 芯片：**本次未随主体发布**（GitHub 的 Intel macOS 运行器资源紧张、需排队）；该版本在发布后作为补充自动上传到同一 Release，或在后续构建周期补齐。"
          fi

          # Install + update notes.
          cat > notes.md <<EOF
          # NectarLink v$VERSION — 自动同步构建

          本发布由镜像流水线每日从上游 [thtbee/nectarlink](https://github.com/thtbee/nectarlink) 同步并自动编译，**版本号与上游保持一致**。它不是官方签名发布：macOS 为 ad-hoc 自签名（首次打开需手动放行），Windows/Linux 为社区自动构建。

          ## 安装说明

          ### Windows
          - 64 位电脑：下载 \`Nectarlink-$VERSION-x64-setup.exe\`，双击运行安装。
          - ARM64 电脑（如 Surface）：下载 \`Nectarlink-$VERSION-arm64-setup.exe\`。

          ### Linux
          - Debian / Ubuntu：\`sudo apt install ./Nectarlink-*.deb\`
          - Fedora / RHEL：\`sudo dnf install ./Nectarlink-*.rpm\`
          - 通用：给 \`Nectarlink-*.AppImage\` 加执行权限后直接运行，或解压 \`Nectarlink-*.tar.gz\`。
          - 一键脚本：\`sh install.sh\`（同目录下放置对应包）。

          ### macOS
          - Apple 芯片（M 系列）：下载 \`NectarLink-$VERSION-macOS-arm64.dmg\`，挂载后拖入“应用程序”。
          $INTEL
          - 首次打开会被 Gatekeeper 拦截（ad-hoc 签名）：右键 App → 打开，或在终端执行
            \`sudo xattr -rd com.apple.quarantine /Applications/NectarLink.app\`。
          - 说明：macOS 为官方“预览版”，文件传输、剪贴板、通知等可用；屏幕镜像 / 虚拟摄像头等重功能尚未完成。

          ## 更新说明（自上次构建以来的提交）
          EOF
          cat changes.txt >> notes.md
          {
            echo ""
            echo "构建于上游提交 \`${COMMIT:0:7}\`（$(date -u +%Y-%m-%d)）。校验和见 SHA256SUMS.txt。"
          } >> notes.md

          # Build the file list dynamically (only what exists).
          shopt -s nullglob
          FILES=( *.exe *.deb *.rpm *.AppImage *.tar.gz *.dmg install.sh SHA256SUMS.txt notes.md )
          shopt -u nullglob

          # Rolling release: replace the previous "nightly" release + tag.
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create nightly \
            "${FILES[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$COMMIT" \
            --title "NectarLink v$VERSION · 自动构建 ($(date -u +%Y-%m-%d))" \
            --notes-file notes.md
          echo "published nightly @ $VERSION"

  macos-intel:
    name: macOS app (Intel) — best effort, attaches after publish
    needs: [publish]
    if: needs.publish.result == 'success'
    runs-on: macos-13
    continue-on-error: true
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      QT_VERSION: "6.12.0"
    steps:
      - uses: actions/checkout@v7
        with: { ref: main }
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: mirror-macos-intel, save-if: true }
      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtshadertools
          cache: true
          aqtsource: git+https://github.com/miurahr/aqtinstall.git
      - name: Build the desktop app
        run: cargo build --release -p nectarlink-desktop
      - name: Package the .app and .dmg
        run: bash desktop/packaging/macos/build-app.sh
      - name: Attach the Intel .dmg to the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DMG=$(ls dist/NectarLink-*-x86_64.dmg 2>/dev/null || true)
          if [ -n "$DMG" ]; then
            gh release upload nightly "$DMG" \
              --repo "$GITHUB_REPOSITORY" --clobber || true
            echo "attached $DMG to nightly"
          else
            echo "no Intel dmg produced; skipping attach"
          fi
